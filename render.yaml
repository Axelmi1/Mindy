services:
  - type: web
    name: mindy-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: |
      cd ../shared && npm install --include=dev --legacy-peer-deps && npm run build && \
      cd ../server && npm install --include=dev --legacy-peer-deps && ./node_modules/.bin/prisma generate && npm run build && ./node_modules/.bin/prisma db push --accept-data-loss && (./node_modules/.bin/ts-node prisma/add-domain-lessons.ts || echo "[deploy] add-domain-lessons a échoué (non-bloquant) — les leçons ne seront pas insérées") && (./node_modules/.bin/ts-node prisma/add-demo-leaderboard.ts || echo "[deploy] add-demo-leaderboard a échoué (non-bloquant) — le classement démo ne sera pas inséré") && (./node_modules/.bin/ts-node prisma/add-domain-achievements.ts || echo "[deploy] add-domain-achievements a échoué (non-bloquant) — les succès des nouveaux domaines ne seront pas insérés") && (./node_modules/.bin/ts-node prisma/seed-master-quizzes.ts || echo "[deploy] seed-master-quizzes a échoué (non-bloquant) — les Master Tests legacy ne seront pas mis à jour") && (./node_modules/.bin/ts-node prisma/add-admin-user.ts || echo "[deploy] add-admin-user a échoué (non-bloquant) — le compte de démo admin ne sera pas créé")
    startCommand: npm run start:prod
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
